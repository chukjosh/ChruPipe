openapi: 3.0.3
info:
  title: ChruPipe API
  version: 1.0.0
  description: API for media search, playback metadata, local user data, exports/imports, downloads, and settings management.
servers:
  - url: http://127.0.0.1:8080
security: []
tags:
  - name: Media
  - name: Local Data
  - name: Downloads
  - name: Settings
paths:
  /services:
    get:
      tags: [Media]
      summary: List supported streaming services
      responses:
        '200':
          description: Supported platform metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceInfoModel'

  /search:
    get:
      tags: [Media]
      summary: Search media content
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: Search query to run against the selected platform.
        - in: query
          name: service
          required: false
          schema:
            type: string
            default: youtube
          description: Service identifier such as youtube or soundcloud.
      responses:
        '200':
          description: Search result set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchModel'
        '400':
          description: Missing required q parameter.

  /stream:
    get:
      tags: [Media]
      summary: Fetch stream metadata for a media URL
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
          description: Full media URL to resolve.
      responses:
        '200':
          description: Stream metadata for the target video or track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamModel'
        '400':
          description: Missing url parameter.

  /stream/{id}:
    get:
      tags: [Media]
      summary: Fetch stream metadata by YouTube video ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: YouTube video ID.
      responses:
        '200':
          description: Stream metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamModel'

  /channel:
    get:
      tags: [Media]
      summary: Fetch channel or artist details
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
          description: Channel or artist URL.
      responses:
        '200':
          description: Channel metadata including recent videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelModel'

  /channel/{id}:
    get:
      tags: [Media]
      summary: Fetch YouTube channel by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Channel metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelModel'

  /trending:
    get:
      tags: [Media]
      summary: Fetch trending content for a service
      parameters:
        - in: query
          name: service
          required: false
          schema:
            type: string
            default: youtube
      responses:
        '200':
          description: Trending items for the service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VideoModel'

  /comments:
    get:
      tags: [Media]
      summary: Fetch comments for a media URL
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Comment payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsModel'

  /comments/{videoId}:
    get:
      tags: [Media]
      summary: Fetch comments using legacy video ID shorthand
      parameters:
        - in: path
          name: videoId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentsModel'

  /history:
    get:
      tags: [Local Data]
      summary: List watched history entries
      responses:
        '200':
          description: History entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryModel'
    post:
      tags: [Local Data]
      summary: Add an item to watch history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToHistoryRequest'
      responses:
        '201':
          description: Item saved to history.
    delete:
      tags: [Local Data]
      summary: Clear all history entries
      responses:
        '204':
          description: History cleared.

  /history/export:
    get:
      tags: [Local Data]
      summary: Export history as an envelope
      responses:
        '200':
          description: History export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEnvelopeHistory'

  /history/import:
    post:
      tags: [Local Data]
      summary: Import history entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: JSON array of HistoryModel entries, or an object containing { type, data }
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/HistoryModel'
                - $ref: '#/components/schemas/ExportEnvelopeHistory'
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryImportSummary'

  /watchlist:
    get:
      tags: [Local Data]
      summary: List watchlist entries
      responses:
        '200':
          description: Watchlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistModel'
    post:
      tags: [Local Data]
      summary: Add a video to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToWatchlistRequest'
      responses:
        '201':
          description: Video added.

  /watchlist/export:
    get:
      tags: [Local Data]
      summary: Export watchlist
      responses:
        '200':
          description: Watchlist export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEnvelopeWatchlist'

  /watchlist/import:
    post:
      tags: [Local Data]
      summary: Import watchlist entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/WatchlistModel'
                - $ref: '#/components/schemas/ExportEnvelopeWatchlist'
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryImportSummary'

  /playlists:
    get:
      tags: [Local Data]
      summary: List playlists with their videos
      responses:
        '200':
          description: Playlist list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaylistWithVideos'
    post:
      tags: [Local Data]
      summary: Create a new playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaylistRequest'
      responses:
        '201':
          description: Playlist created and ID returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int32

  /playlists/export:
    get:
      tags: [Local Data]
      summary: Export all playlists
      responses:
        '200':
          description: Playlist export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEnvelopePlaylists'

  /playlists/import:
    post:
      tags: [Local Data]
      summary: Import playlists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/PlaylistWithVideos'
                - $ref: '#/components/schemas/ExportEnvelopePlaylists'
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryImportSummary'

  /playlists/{id}:
    get:
      tags: [Local Data]
      summary: Fetch a single playlist by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Playlist with videos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistWithVideos'
        '404':
          description: Playlist not found.

  /playlists/{id}/videos:
    post:
      tags: [Local Data]
      summary: Add a video to an existing playlist
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToPlaylistRequest'
      responses:
        '201':
          description: Video added to playlist.

  /subscriptions:
    get:
      tags: [Local Data]
      summary: List subscriptions
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionModel'
    post:
      tags: [Local Data]
      summary: Subscribe to a channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
      responses:
        '200':
          description: Subscription added or already existed.
        '201':
          description: New subscription created.
    delete:
      tags: [Local Data]
      summary: Delete multiple subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionDeleteRequest'
      responses:
        '200':
          description: Number of deleted subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDeleteSummary'

  /subscriptions/{id}:
    delete:
      tags: [Local Data]
      summary: Delete one subscription
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Subscription deleted.
        '400':
          description: Invalid subscription ID.

  /subscriptions/export:
    get:
      tags: [Local Data]
      summary: Export subscriptions
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json, txt, text]
            default: json
      responses:
        '200':
          description: Subscriptions export payload or plain-text list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportEnvelopeSubscriptions'
            text/plain:
              schema:
                type: string

  /subscriptions/import:
    post:
      tags: [Local Data]
      summary: Import subscription data
      parameters:
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [json, txt, text]
        - in: query
          name: overwrite
          required: false
          description: Replace all existing subscriptions before importing.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/SubscriptionModel'
                - $ref: '#/components/schemas/ExportEnvelopeSubscriptions'
      responses:
        '200':
          description: Import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionImportSummary'

  /feed:
    get:
      tags: [Local Data]
      summary: Fetch latest videos from subscribed channels
      responses:
        '200':
          description: Feed items from subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VideoModel'

  /downloads:
    get:
      tags: [Downloads]
      summary: List all downloads
      responses:
        '200':
          description: Download status list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DownloadModel'
    post:
      tags: [Downloads]
      summary: Start a new download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDownloadRequest'
      responses:
        '202':
          description: Download accepted and queued.

  /downloads/{id}:
    get:
      tags: [Downloads]
      summary: Get a single download record
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Download metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadModel'

  /downloads/{id}/pause:
    post:
      tags: [Downloads]
      summary: Pause a running or queued download
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: Download paused.

  /downloads/{id}/resume:
    post:
      tags: [Downloads]
      summary: Resume a paused download
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '202':
          description: Download resumed.

  /downloads/{id}/retry:
    post:
      tags: [Downloads]
      summary: Retry a failed download
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '202':
          description: Download restarted.

  /downloads/{id}/file:
    get:
      tags: [Downloads]
      summary: Download the actual file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Binary file response.

  /settings/storage:
    get:
      tags: [Settings]
      summary: Get configured storage directories
      responses:
        '200':
          description: Storage configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadsDir:
                    type: string
                  dataDir:
                    type: string
                  trendingCountry:
                    type: string
    post:
      tags: [Settings]
      summary: Update storage configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                downloadsDir:
                  type: string
                dataDir:
                  type: string
                trendingCountry:
                  type: string
      responses:
        '200':
          description: Settings saved.

  /export:
    get:
      tags: [Local Data]
      summary: Export all local app data in one bundle
      responses:
        '200':
          description: Combined local-data export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedExportEnvelope'

  /import:
    post:
      tags: [Local Data]
      summary: Import all local app data in one bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CombinedExportEnvelope'
      responses:
        '200':
          description: Combined import summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedImportSummary'

  /docs:
    get:
      tags: [Documentation]
      summary: Open the Swagger UI for this API
      responses:
        '200':
          description: HTML page with the interactive Swagger UI.

  /openapi.yaml:
    get:
      tags: [Documentation]
      summary: Download the OpenAPI spec file
      responses:
        '200':
          description: YAML OpenAPI specification.
          content:
            application/yaml:
              schema:
                type: string

components:
  schemas:
    VideoModel:
      type: object
      required: [id, title, uploader, uploaderUrl, duration, viewCount, uploadDate, thumbnailUrl, url, service]
      properties:
        id:
          type: string
        title:
          type: string
        uploader:
          type: string
        uploaderUrl:
          type: string
        duration:
          type: integer
          format: int64
        viewCount:
          type: integer
          format: int64
        uploadDate:
          type: string
        uploadDateTimestamp:
          type: integer
          format: int64
          nullable: true
        thumbnailUrl:
          type: string
        description:
          type: string
        isLive:
          type: boolean
        url:
          type: string
        service:
          type: string

    SearchModel:
      type: object
      required: [query, service, items]
      properties:
        query:
          type: string
        service:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoModel'
        nextPage:
          type: string
          nullable: true

    StreamUrl:
      type: object
      required: [url, quality, format, isVideoOnly]
      properties:
        url:
          type: string
        quality:
          type: string
        format:
          type: string
        isVideoOnly:
          type: boolean

    SubtitleTrack:
      type: object
      required: [url, languageCode, languageName, isAutoGenerated]
      properties:
        url:
          type: string
        languageCode:
          type: string
        languageName:
          type: string
        isAutoGenerated:
          type: boolean

    StreamModel:
      type: object
      required: [id, title, uploader, duration, videoStreams, audioStreams, subtitles, relatedVideos, service, thumbnailUrl]
      properties:
        id:
          type: string
        title:
          type: string
        uploader:
          type: string
        uploaderUrl:
          type: string
        duration:
          type: integer
          format: int64
        videoStreams:
          type: array
          items:
            $ref: '#/components/schemas/StreamUrl'
        audioStreams:
          type: array
          items:
            $ref: '#/components/schemas/StreamUrl'
        hlsUrl:
          type: string
          nullable: true
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleTrack'
        relatedVideos:
          type: array
          items:
            $ref: '#/components/schemas/VideoModel'
        service:
          type: string
        thumbnailUrl:
          type: string

    ChannelModel:
      type: object
      required: [id, name, url, description, subscriberCount, avatarUrl, bannerUrl, videos, service]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        description:
          type: string
        subscriberCount:
          type: integer
          format: int64
        avatarUrl:
          type: string
        bannerUrl:
          type: string
        videos:
          type: array
          items:
            $ref: '#/components/schemas/VideoModel'
        service:
          type: string

    CommentModel:
      type: object
      required: [id, author, authorAvatarUrl, text, likeCount, isHeartedByUploader, isPinned, publishedDate]
      properties:
        id:
          type: string
        author:
          type: string
        authorAvatarUrl:
          type: string
        text:
          type: string
        likeCount:
          type: integer
          format: int32
        isHeartedByUploader:
          type: boolean
        isPinned:
          type: boolean
        publishedDate:
          type: string

    CommentsModel:
      type: object
      required: [videoId, comments]
      properties:
        videoId:
          type: string
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CommentModel'
        nextPage:
          type: string
          nullable: true

    HistoryModel:
      type: object
      required: [id, videoId, title, uploader, thumbnailUrl, duration, watchedAt, watchedSeconds, service, url]
      properties:
        id:
          type: integer
          format: int32
        videoId:
          type: string
        title:
          type: string
        uploader:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
          format: int64
        watchedAt:
          type: string
          format: date-time
        watchedSeconds:
          type: integer
          format: int64
        service:
          type: string
        url:
          type: string

    WatchlistModel:
      type: object
      required: [id, videoId, title, uploader, thumbnailUrl, duration, addedAt, service, url]
      properties:
        id:
          type: integer
          format: int32
        videoId:
          type: string
        title:
          type: string
        uploader:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        service:
          type: string
        url:
          type: string

    PlaylistVideoModel:
      type: object
      required: [id, videoId, title, uploader, thumbnailUrl, duration, addedAt, position, service, url]
      properties:
        id:
          type: integer
          format: int32
        videoId:
          type: string
        title:
          type: string
        uploader:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
          format: int64
        addedAt:
          type: string
          format: date-time
        position:
          type: integer
          format: int32
        service:
          type: string
        url:
          type: string

    PlaylistWithVideos:
      type: object
      required: [id, name, description, createdAt, videos]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        videos:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistVideoModel'

    SubscriptionModel:
      type: object
      required: [id, channelId, channelName, channelUrl, avatarUrl, subscribedAt, service]
      properties:
        id:
          type: integer
          format: int32
        channelId:
          type: string
        channelName:
          type: string
        channelUrl:
          type: string
        avatarUrl:
          type: string
        subscribedAt:
          type: string
          format: date-time
        service:
          type: string

    SubscriptionDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int32

    SubscriptionDeleteSummary:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int32

    DownloadModel:
      type: object
      required: [id, videoId, title, uploader, thumbnailUrl, filePath, fileSize, downloadedBytes, status, quality, isAudioOnly, createdAt, service]
      properties:
        id:
          type: integer
          format: int32
        videoId:
          type: string
        title:
          type: string
        uploader:
          type: string
        thumbnailUrl:
          type: string
        filePath:
          type: string
        fileSize:
          type: integer
          format: int64
        downloadedBytes:
          type: integer
          format: int64
        status:
          type: string
        quality:
          type: string
        isAudioOnly:
          type: boolean
        createdAt:
          type: string
          format: date-time
        service:
          type: string
        streamUrl:
          type: string
          nullable: true

    ServiceInfoModel:
      type: object
      required: [id, name, baseUrl, supportsTrending, supportsComments]
      properties:
        id:
          type: string
        name:
          type: string
        baseUrl:
          type: string
        supportsTrending:
          type: boolean
        supportsComments:
          type: boolean

    AddToHistoryRequest:
      type: object
      required: [videoId, title, uploader, thumbnailUrl, duration]
      properties:
        videoId:
          type: string
        title:
          type: string
        uploader:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
          format: int64
        watchedSeconds:
          type: integer
          format: int64
        service:
          type: string
        url:
          type: string

    AddToWatchlistRequest:
      type: object
      required: [videoId, title, uploader, thumbnailUrl, duration]
      properties:
        videoId:
          type: string
        title:
          type: string
        uploader:
          type: string
        thumbnailUrl:
          type: string
        duration:
          type: integer
          format: int64
        service:
          type: string
        url:
          type: string

    AddToPlaylistRequest:
      type: object
      required: [videoId, title, uploader, thumbnailUrl, duration]
